[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-analyzer"
version = "1.3.0"
description = "Structured analysis, scoring and job matching for curriculum vitae documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]

[project.scripts]
cv-analyzer = "cv_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["cv_analyzer*"]

[tool.setuptools.package-data]
cv_analyzer = ["data/*.json"]

[tool.unittest]
start-dir = "tests"
